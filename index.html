<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Coya - Redirecting...</title>
    
    <meta http-equiv="refresh" content="0;url=es.html">

    <script>
        (function() {
            var lang = navigator.language || navigator.userLanguage; 
            
            if (lang.startsWith('ca')) {
                window.location.replace('ca.html');
            } 
            else if (lang.startsWith('en')) {
                window.location.replace('en.html');
            } 
            else {
                window.location.replace('es.html');
            }
        })();
    </script>
</head>
<body>
    <p>Redirigiendo a <a href="es.html">la versión en Español</a>...</p>
</body>
</html>
